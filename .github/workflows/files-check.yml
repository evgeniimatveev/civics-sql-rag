name: Files check

# Automatic and light: no Cloudflare, no network, standard library only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Corpus is valid and reproducible from its sources, README chunk count is right
        run: python .github/scripts/check_repo.py
